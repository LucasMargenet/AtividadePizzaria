# Conex\u00e3o com MongoDB: por padr\u00e3o aponta para um MongoDB local (Docker).
# Para usar outro banco (ex: Atlas), defina a vari\u00e1vel de ambiente MONGODB_URI
# antes de rodar a aplica\u00e7\u00e3o. Nunca commitar credenciais reais aqui.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=pizzaria

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG