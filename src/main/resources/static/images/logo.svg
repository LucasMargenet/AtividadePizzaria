<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <defs>
    <radialGradient id="crust" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f3c46b"/>
      <stop offset="75%" stop-color="#e3a84a"/>
      <stop offset="100%" stop-color="#c4812f"/>
    </radialGradient>
    <radialGradient id="cheese" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#f6b93b"/>
    </radialGradient>
  </defs>

  <!-- Pizza -->
  <g>
    <circle cx="120" cy="88" r="72" fill="url(#crust)"/>
    <circle cx="120" cy="88" r="60" fill="url(#cheese)"/>

    <!-- Fatias -->
    <g stroke="#e3a84a" stroke-width="2.5" opacity="0.85">
      <line x1="120" y1="88" x2="120" y2="28"/>
      <line x1="120" y1="88" x2="172" y2="60"/>
      <line x1="120" y1="88" x2="172" y2="116"/>
      <line x1="120" y1="88" x2="120" y2="148"/>
      <line x1="120" y1="88" x2="68" y2="116"/>
      <line x1="120" y1="88" x2="68" y2="60"/>
    </g>

    <!-- Pepperoni -->
    <g fill="#c0392b">
      <circle cx="120" cy="55" r="9"/>
      <circle cx="152" cy="75" r="9"/>
      <circle cx="152" cy="105" r="9"/>
      <circle cx="120" cy="122" r="9"/>
      <circle cx="88" cy="105" r="9"/>
      <circle cx="88" cy="75" r="9"/>
      <circle cx="120" cy="88" r="9"/>
    </g>
    <g fill="#e0564a">
      <circle cx="117" cy="52" r="2.5"/>
      <circle cx="149" cy="72" r="2.5"/>
      <circle cx="149" cy="102" r="2.5"/>
      <circle cx="117" cy="119" r="2.5"/>
      <circle cx="85" cy="102" r="2.5"/>
      <circle cx="85" cy="72" r="2.5"/>
    </g>

    <!-- Manjericão -->
    <g fill="#4a7c3f">
      <ellipse cx="103" cy="68" rx="6" ry="3.5" transform="rotate(-20 103 68)"/>
      <ellipse cx="137" cy="100" rx="6" ry="3.5" transform="rotate(25 137 100)"/>
      <ellipse cx="100" cy="108" rx="6" ry="3.5" transform="rotate(10 100 108)"/>
    </g>
  </g>

  <!-- Nome -->
  <text x="120" y="182" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="26" font-weight="800" fill="#b23a1e">Pediu Patrão</text>
  <text x="120" y="204" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="13" letter-spacing="3" fill="#8a6d3b">PIZZARIA</text>
</svg>
