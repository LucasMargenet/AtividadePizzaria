<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-shield-check me-2 text-primary"></i>Auditoria
        </h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data/Hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Alterações</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro de auditoria encontrado.
                        </td>
                    </tr>
                    <tr th:each="registro : ${registros}">
                        <td class="ps-4 text-nowrap"
                            th:text="${#temporals.format(registro.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td th:text="${registro.usuarioUsername}"></td>
                        <td th:text="${registro.perfil}"></td>
                        <td th:text="${registro.tipoOperacao}"></td>
                        <td th:text="${registro.entidade} + ' (' + ${registro.entidadeId} + ')'"></td>
                        <td>
                            <div th:each="alteracao : ${registro.alteracoes}" class="small">
                                <strong th:text="${alteracao.campo}"></strong>:
                                <span th:text="${alteracao.valorAnterior} ?: '—'"></span>
                                →
                                <span th:text="${alteracao.valorNovo} ?: '—'"></span>
                            </div>
                        </td>
                        <td th:text="${registro.justificativa}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(registros)}">
            Total: <strong th:text="${#lists.size(registros)}"></strong> registro(s)
        </div>
    </div>

</div>

</body>
</html>
