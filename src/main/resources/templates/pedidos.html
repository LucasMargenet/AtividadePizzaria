<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary" th:if="${perfil == 'ATENDENTE' or perfil == 'GERENTE'}">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" id="erro-status" style="display:none;" role="alert">
        <span id="erro-status-texto"></span>
        <button type="button" class="btn-close" onclick="document.getElementById('erro-status').style.display='none'"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Itens</th>
                        <th>Valor Total</th>
                        <th>Responsável</th>
                        <th>Entrada</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <span th:each="item, stat : ${pedido.itens}">
                                <span th:text="${item.quantidade} + 'x ' + ${item.nomeProduto}"></span><span th:if="${!stat.last}">, </span>
                            </span>
                        </td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 2)}"></td>
                        <td th:text="${pedido.responsavelRegistroUsername}"></td>
                        <td th:text="${pedido.dataHoraEntrada != null} ? ${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')} : '-'"></td>
                        <td th:with="statusNome=${pedido.status.name()}">
                            <span class="badge"
                                  th:classappend="${statusNome == 'FINALIZADO'} ? 'bg-success' :
                                                  (${statusNome == 'CANCELADO'} ? 'bg-danger' :
                                                  (${statusNome == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                            <div class="text-muted small" th:if="${statusNome == 'CANCELADO'}"
                                 th:text="${pedido.justificativaCancelamento}"></div>
                        </td>
                        <td class="text-end pe-4"
                            th:with="statusNome=${pedido.status.name()},
                                    proximo=${statusNome == 'RECEBIDO'} ? 'EM_PREPARACAO' :
                                     ((${statusNome == 'EM_PREPARACAO'}) ? 'PRONTO' :
                                     ((${statusNome == 'PRONTO'}) ? 'SAIU_PARA_ENTREGA_RETIRADO' :
                                     ((${statusNome == 'SAIU_PARA_ENTREGA_RETIRADO'}) ? 'FINALIZADO' : null))),
                                    podeCancelarOuDescontar=${statusNome == 'RECEBIDO' or statusNome == 'EM_PREPARACAO' or statusNome == 'PRONTO'}">
                            <div class="d-flex gap-1 justify-content-end flex-wrap">
                                <button th:if="${proximo != null and (perfil == 'ATENDENTE' or perfil == 'GERENTE')}"
                                        type="button" class="btn btn-sm btn-outline-primary"
                                        th:attr="onclick=|avancarStatus('${pedido.id}', '${proximo}')|"
                                        th:text="'Avançar para ' + ${proximo}">
                                </button>
                                <button th:if="${podeCancelarOuDescontar and perfil == 'GERENTE'}"
                                        type="button" class="btn btn-sm btn-outline-warning"
                                        th:attr="onclick=|aplicarDesconto('${pedido.id}')|">
                                    Desconto
                                </button>
                                <button th:if="${podeCancelarOuDescontar and perfil == 'GERENTE'}"
                                        type="button" class="btn btn-sm btn-outline-danger"
                                        th:attr="onclick=|cancelarPedido('${pedido.id}')|">
                                    Cancelar
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>
        function mostrarErroStatus(mensagem) {
            document.getElementById('erro-status-texto').textContent = mensagem;
            document.getElementById('erro-status').style.display = 'block';
        }

        async function avancarStatus(id, novoStatus) {
            const response = await fetch(`/api/pedidos/${id}/status?status=${novoStatus}`, { method: 'PUT' });
            if (response.ok) {
                window.location.reload();
            } else {
                const corpo = await response.json().catch(() => ({}));
                mostrarErroStatus(corpo.erro || 'Não foi possível atualizar o status do pedido.');
            }
        }

        async function cancelarPedido(id) {
            const justificativa = prompt('Justificativa do cancelamento (obrigatória):');
            if (justificativa === null) return;
            if (!justificativa.trim()) {
                mostrarErroStatus('É obrigatório informar a justificativa do cancelamento.');
                return;
            }

            const response = await fetch(`/api/pedidos/${id}/cancelar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ justificativa })
            });

            if (response.ok) {
                window.location.reload();
            } else {
                const corpo = await response.json().catch(() => ({}));
                mostrarErroStatus(corpo.erro || 'Não foi possível cancelar o pedido.');
            }
        }

        async function aplicarDesconto(id) {
            const percentualTexto = prompt('Percentual de desconto (0 a 20):');
            if (percentualTexto === null) return;
            const percentual = parseFloat(percentualTexto);
            if (isNaN(percentual) || percentual < 0 || percentual > 20) {
                mostrarErroStatus('O desconto deve ser um percentual entre 0 e 20.');
                return;
            }

            const response = await fetch(`/api/pedidos/${id}/desconto`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ percentual })
            });

            if (response.ok) {
                window.location.reload();
            } else {
                const corpo = await response.json().catch(() => ({}));
                mostrarErroStatus(corpo.erro || 'Não foi possível aplicar o desconto.');
            }
        }
    </script>

</div>

</body>
</html>
