<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <div class="alert alert-danger" id="erro-produto" style="display:none;"></div>

    <div class="collapse mb-4" id="formularioProduto">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <input type="hidden" id="produto-id">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label fw-medium">Nome</label>
                        <input type="text" id="produto-nome" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-medium">Tipo</label>
                        <select id="produto-tipo" class="form-select">
                            <option value="Pizza">Pizza</option>
                            <option value="Lanche">Lanche</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Porção">Porção</option>
                            <option value="Adicional">Adicional</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-medium">Preço</label>
                        <input type="number" id="produto-preco" class="form-control" step="0.01" min="0" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" id="produto-ativo" class="form-check-input" checked>
                            <label for="produto-ativo" class="form-check-label">Ativo</label>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="button" class="btn btn-success" id="btn-salvar-produto">Salvar</button>
                    <button type="button" class="btn btn-outline-secondary" id="btn-cancelar-produto"
                            data-bs-toggle="collapse" data-bs-target="#formularioProduto">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="produtos-tabela"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/produtos';
        const tabelaProdutos = document.getElementById('produtos-tabela');

        function mostrarErroProduto(mensagem) {
            const el = document.getElementById('erro-produto');
            el.textContent = mensagem;
            el.style.display = 'block';
        }

        async function carregarProdutos() {
            const response = await fetch(API_URL);
            const produtos = await response.json();
            tabelaProdutos.innerHTML = '';

            if (produtos.length === 0) {
                tabelaProdutos.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            produtos.forEach(produto => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="ps-4">${produto.nome}</td>
                    <td>${produto.tipo || '—'}</td>
                    <td>R$ ${Number(produto.preco).toFixed(2)}</td>
                    <td>${produto.ativo ? 'Sim' : 'Não'}</td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick='editarProduto(${JSON.stringify(produto)})'>
                            <i class="bi bi-pencil-fill"></i> Editar
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="excluirProduto('${produto.id}')">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>
                    </td>
                `;
                tabelaProdutos.appendChild(row);
            });
        }

        function editarProduto(produto) {
            document.getElementById('produto-id').value = produto.id;
            document.getElementById('produto-nome').value = produto.nome;
            document.getElementById('produto-tipo').value = produto.tipo;
            document.getElementById('produto-preco').value = produto.preco;
            document.getElementById('produto-ativo').checked = !!produto.ativo;
            new bootstrap.Collapse(document.getElementById('formularioProduto')).show();
        }

        function limparFormulario() {
            document.getElementById('produto-id').value = '';
            document.getElementById('produto-nome').value = '';
            document.getElementById('produto-preco').value = '';
            document.getElementById('produto-ativo').checked = true;
        }

        document.getElementById('btn-salvar-produto').addEventListener('click', async () => {
            const id = document.getElementById('produto-id').value;
            const produto = {
                nome: document.getElementById('produto-nome').value,
                tipo: document.getElementById('produto-tipo').value,
                preco: parseFloat(document.getElementById('produto-preco').value),
                ativo: document.getElementById('produto-ativo').checked
            };

            if (!produto.nome || isNaN(produto.preco)) {
                mostrarErroProduto('Preencha nome e preço do produto.');
                return;
            }

            const response = await fetch(id ? `${API_URL}/${id}` : API_URL, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(produto)
            });

            if (response.ok) {
                document.getElementById('erro-produto').style.display = 'none';
                limparFormulario();
                new bootstrap.Collapse(document.getElementById('formularioProduto')).hide();
                carregarProdutos();
            } else {
                mostrarErroProduto('Não foi possível salvar o produto.');
            }
        });

        async function excluirProduto(id) {
            if (confirm('Tem certeza que deseja excluir este produto?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    carregarProdutos();
                } else {
                    mostrarErroProduto('Não foi possível excluir o produto.');
                }
            }
        }

        carregarProdutos();
    </script>

</div>

</body>
</html>
